[project]
name = "portmaster"
# Una sola fuente: `portmaster/__init__.py`. Con el numero escrito en los dos
# lados, un release publica el de aca y `portmaster --version` muestra el otro
# en cuanto alguien se olvide de sincronizarlos.
dynamic = ["version"]
description = "Orquestador de entornos de desarrollo locales: puertos, Docker, backend y frontend con un solo comando"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "TicoraX" }]
keywords = ["cli", "devtools", "ports", "docker", "orchestration", "dx"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "psutil>=6.0",
    "pyyaml>=6.0",
    # La interfaz web no es un extra. Con `pipx` o `uv tool`, que son los dos
    # metodos que documenta el README, `pip install 'portmaster[web]'` instala
    # en el interprete del PATH y no en el venv aislado de la herramienta: el
    # usuario queda en un bucle donde el mensaje de error sugiere un comando
    # que no arregla nada. Son 15 MB en algo que ya trae psutil y rich.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/TicoraX/PortMaster"
Issues = "https://github.com/TicoraX/PortMaster/issues"

[project.scripts]
portmaster = "portmaster.cli:app"

[tool.ruff.lint]
# El default de ruff (E4, E7, E9, F) mas orden de imports. Lo que interesa es F:
# nombre indefinido, import sin usar, variable perdida. Un bloque de codigo que
# se cae en un merge sale ahi y no lo ve ningun test.
#
# Fuera quedan E501, B904 y el resto del catalogo de estilo: sumaban 32 hallazgos
# en codigo que funciona, y adoptarlos obligaba a un commit de reformateo que
# nadie pidio.
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "portmaster/__init__.py"

[tool.hatch.build.targets.wheel]
# `packages` ya se lleva portmaster/web entero, HTML, CSS y JS incluidos. El
# force-include que habia aca los agregaba una segunda vez y el build moria con
# "a second file is being added at the same path". Nunca se noto porque nadie
# habia empacado la herramienta todavia: se instalaba con `pip install -e`.
packages = ["portmaster"]
