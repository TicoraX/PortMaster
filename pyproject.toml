[project]
name = "portmaster"
version = "0.1.0"
description = "Orquestador de entornos de desarrollo locales: puertos, Docker, backend y frontend con un solo comando"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "TicoraX" }]
keywords = ["cli", "devtools", "ports", "docker", "orchestration", "dx"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "psutil>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27", "portmaster[web]"]

[project.urls]
Homepage = "https://github.com/TicoraX/PortMaster"
Issues = "https://github.com/TicoraX/PortMaster/issues"

[project.scripts]
portmaster = "portmaster.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portmaster"]

[tool.hatch.build.targets.wheel.force-include]
"portmaster/web" = "portmaster/web"
